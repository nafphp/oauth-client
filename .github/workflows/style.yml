name: PHP code style

on:
  push:
    branches: [main, 'v*-rc']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, json, mbstring, openssl
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer style:check
